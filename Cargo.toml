[package]
name = "git-parsec"
version = "0.2.2"
edition = "2021"
authors = ["erishforG"]
description = "Git worktree lifecycle manager for parallel AI agent workflows with ticket tracker integration"
license = "MIT"
repository = "https://github.com/erishforG/git-parsec"
homepage = "https://erishforg.github.io/git-parsec/"
keywords = ["git", "worktree", "parallel", "ai", "workflow"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "parsec"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
colored = "2"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tabled = { version = "0.17", features = ["ansi"] }
indicatif = "0.17"
dialoguer = "0.11"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
clap_mangen = "0.2"
clap_complete = "4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
