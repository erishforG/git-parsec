[package]
name = "git-parsec"
version = "0.3.3"
edition = "2021"
authors = ["erishforG"]
description = "Git worktree lifecycle manager — ticket to PR in one command. Parallel AI agent workflows with Jira & GitHub Issues integration."
license = "MIT"
repository = "https://github.com/erishforG/git-parsec"
homepage = "https://erishforg.github.io/git-parsec/"
documentation = "https://erishforg.github.io/git-parsec/"
keywords = ["git", "worktree", "cli", "jira", "github"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "parsec"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
colored = "3"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tabled = { version = "0.20", features = ["ansi"] }
indicatif = "0.18"
dialoguer = "0.12"
reqwest = { version = "0.13", features = ["json", "query", "rustls", "rustls-native-certs"], default-features = false }
tokio = { version = "1", features = ["full"] }
clap_mangen = "0.3"
clap_complete = "4"
dunce = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
